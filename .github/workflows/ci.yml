name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: SwiftLint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: which swiftlint || brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  build:
    name: Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install xcpretty
        run: gem install xcpretty --no-document 2>/dev/null || true

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project XCUIPlayground.xcodeproj \
            -scheme XCUIPlayground \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty

  test:
    name: Unit Tests
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install xcpretty
        run: gem install xcpretty --no-document 2>/dev/null || true

      - name: Run Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project XCUIPlayground.xcodeproj \
            -scheme XCUIPlayground \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty
